<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PvP Arena Online</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin:0; background:#101522; color:#fff; font:16px system-ui,Arial,sans-serif; text-align:center; }
main { max-width:900px; margin:auto; padding:14px; }
h1 { color:#45d6ff; font-size:clamp(22px,5vw,30px); margin:8px 0; }
p { line-height:1.4; }
.lobby { display:flex; justify-content:center; flex-wrap:wrap; gap:7px; margin:14px 0; }
input,button { font:inherit; padding:11px 13px; border:0; border-radius:10px; }
input { width:150px; background:#252e42; color:white; text-transform:uppercase; }
button { background:#33415f; color:white; cursor:pointer; touch-action:none; }
button:active { filter:brightness(1.3); }
#join { background:#087fa5; font-weight:700; }
#status { min-height:24px; color:#c3d4ee; margin:10px 0; }
#hud { display:flex; gap:8px; margin:10px 0; }
.hp { flex:1; background:#27334a; padding:9px; border-radius:9px; }
canvas { width:100%; height:auto; display:block; background:#18263a; border:2px solid #3c587c; border-radius:12px; touch-action:none; }
#controls { display:flex; justify-content:space-between; align-items:center; gap:14px; margin:12px 0; }
#pad { display:grid; grid-template-columns:repeat(3, minmax(38px,50px)); grid-template-rows:repeat(2,48px); gap:4px; }
#pad button { margin:0; padding:4px; font-size:21px; }
#attack { background:#bd355a; min-width:105px; min-height:68px; font-weight:800; }
small { color:#aab7ce; }
</style>
</head>
<body>
<main>
  <h1>⚔ PVP ARENA ONLINE</h1>
  <p>Masukkan kode room yang sama dengan temanmu untuk bertanding.</p>
  <div class="lobby">
    <input id="room" value="ARENA1" maxlength="20" aria-label="Kode room">
    <button id="join">MASUK ARENA</button>
  </div>
  <div id="status">Menghubungkan ke server...</div>
  <div id="hud">
    <div class="hp">Kamu: <b id="myhp">—</b> HP</div>
    <div class="hp">Lawan: <b id="enemyhp">—</b> HP</div>
  </div>
  <canvas id="game" width="800" height="450" aria-label="Arena game"></canvas>
  <div id="controls">
    <div id="pad">
      <span></span><button data-key="up" aria-label="Atas">▲</button><span></span>
      <button data-key="left" aria-label="Kiri">◀</button>
      <button data-key="down" aria-label="Bawah">▼</button>
      <button data-key="right" aria-label="Kanan">▶</button>
    </div>
    <button id="attack">⚔ SERANG</button>
  </div>
  <p><small>PC: WASD / tombol panah untuk bergerak, Spasi untuk menyerang.<br>Serangan hanya mengenai lawan dalam jarak dekat.</small></p>
</main>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
let myId = null;
let joined = false;
let gameState = { players: [], winner: null };
const keys = { up:false, down:false, left:false, right:false };

document.getElementById("join").addEventListener("click", () => {
  const code = document.getElementById("room").value.trim();
  if (!code) { statusEl.textContent = "Masukkan kode room."; return; }
  if (!socket.connected) { statusEl.textContent = "Belum tersambung ke server."; return; }
  socket.emit("joinRoom", code);
  statusEl.textContent = "Mencoba masuk ke room...";
});

socket.on("connect", () => {
  statusEl.textContent = "Terhubung ke server. Masukkan kode room.";
});
socket.on("connect_error", () => {
  statusEl.textContent = "Gagal terhubung. Periksa server dan koneksi internet.";
});
socket.on("disconnect", () => {
  joined = false;
  myId = null;
  gameState = { players: [], winner: null };
  statusEl.textContent = "Koneksi terputus. Muat ulang halaman untuk mencoba lagi.";
});
socket.on("roomError", message => { statusEl.textContent = message; });
socket.on("joined", data => {
  myId = data.playerId;
  joined = true;
  statusEl.textContent = "Berhasil masuk! Tunggu pemain lawan.";
});
socket.on("state", state => {
  gameState = state;
  const me = state.players.find(p => p.id === myId);
  const enemy = state.players.find(p => p.id !== myId);
  document.getElementById("myhp").textContent = me ? me.hp : "—";
  document.getElementById("enemyhp").textContent = enemy ? enemy.hp : "—";

  if (state.winner) {
    statusEl.textContent = state.winner === myId ? "🏆 KAMU MENANG!" : "Kamu kalah!";
  } else if (state.players.length < 2) {
    statusEl.textContent = "Room aktif — menunggu lawan masuk...";
  } else {
    statusEl.textContent = "Pertandingan berlangsung!";
  }
});

function sendInput() {
  if (joined) socket.emit("input", { ...keys });
}
function setKey(key, value) {
  if (keys[key] === value) return;
  keys[key] = value;
  sendInput();
}
const keyMap = {
  ArrowUp:"up", w:"up", W:"up", ArrowDown:"down", s:"down", S:"down",
  ArrowLeft:"left", a:"left", A:"left", ArrowRight:"right", d:"right", D:"right"
};
window.addEventListener("keydown", e => {
  const k = keyMap[e.key];
  if (k) { e.preventDefault(); setKey(k, true); }
  if (e.code === "Space") { e.preventDefault(); attack(); }
});
window.addEventListener("keyup", e => {
  const k = keyMap[e.key];
  if (k) { e.preventDefault(); setKey(k, false); }
});
window.addEventListener("blur", () => {
  for (const k in keys) keys[k] = false;
  sendInput();
});

document.querySelectorAll("[data-key]").forEach(button => {
  const key = button.dataset.key;
  button.addEventListener("pointerdown", e => {
    e.preventDefault();
    try { button.setPointerCapture(e.pointerId); } catch (_) {}
    setKey(key, true);
  });
  const release = e => { e.preventDefault(); setKey(key, false); };
  button.addEventListener("pointerup", release);
  button.addEventListener("pointercancel", release);
  button.addEventListener("lostpointercapture", () => setKey(key, false));
});
function attack() {
  if (joined && !gameState.winner) socket.emit("attack");
}
document.getElementById("attack").addEventListener("pointerdown", e => {
  e.preventDefault(); attack();
});
document.getElementById("attack").addEventListener("contextmenu", e => e.preventDefault());

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#18263a";
  ctx.fillRect(0, 0, 800, 450);
  ctx.strokeStyle = "#293b54";
  ctx.lineWidth = 1;
  for (let x=0; x<=800; x+=50) {
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,450); ctx.stroke();
  }
  for (let y=0; y<=450; y+=50) {
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(800,y); ctx.stroke();
  }
  ctx.strokeStyle = "#526d8d";
  ctx.lineWidth = 3;
  ctx.strokeRect(10,10,780,430);

  for (const p of gameState.players) {
    ctx.beginPath();
    ctx.arc(p.x,p.y,20,0,Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.strokeStyle = p.id === myId ? "#fff" : "#ffdf80";
    ctx.lineWidth = p.id === myId ? 3 : 1;
    ctx.stroke();

    ctx.fillStyle = "#fff";
    ctx.font = "bold 13px system-ui";
    ctx.textAlign = "center";
    ctx.fillText(p.id === myId ? "KAMU" : "LAWAN",p.x,p.y-29);
    ctx.fillStyle = "#222";
    ctx.fillRect(p.x-22,p.y+27,44,5);
    ctx.fillStyle = p.hp > 30 ? "#51e18b" : "#ff4d68";
    ctx.fillRect(p.x-22,p.y+27,44*p.hp/100,5);
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
